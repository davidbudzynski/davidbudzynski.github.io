# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server
# process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings These are used to personalize your new site. If you look in the
# HTML files, you will see them accessed via {{ site.title }}, {{ site.email }},
# and so on. You can create any custom variable you would like, and they will be
# accessible in the templates via {{ site.myvariable }}.

title: David Budzyński
author: David Budzyński
lang: en-GB
timezone: Europe/London
# email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  This is my blog where I share my thoughts on statistics, computer science, software, and technology.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://davidbudzynski.github.io" # the base hostname & protocol for your site, e.g. http://example.com
github_username: davidbudzynski
rss: RSS

# Explicit permalink without :categories so URLs stay stable even if a
# category ever slips back into front matter.
permalink: /:year/:month/:day/:title.html
# Scheduled posts (future-dated) stay hidden until their date — intentional.
future: false
excerpt_separator: <!--more-->
show_excerpts: true

header_pages:
  - about.md
  - projects.md
  - archive.md
  - tags.html
  - search.md

minima:
  # NOTE: github-pages pins minima 2.5.1, which ignores `skin`.
  # Kept as forward-compat for minima 3.x (auto = light/dark by OS setting).
  skin: auto
  # Social icons on minima 2.5.x come from the legacy `github_username` /
  # `rss` keys above via _includes/social.html, not from social_links.

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from
# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - AGENTS.md
