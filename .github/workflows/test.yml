name: tests

on:
  push:
  pull_request:

jobs:
  site-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stdlib only (minitest + yaml) — no `bundle install` needed,
      # so this stays fast.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: ruby -Itests tests/test_site.rb
